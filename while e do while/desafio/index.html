<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Magia da Palavra Secreta</title>

  <style>
    body {
      background: linear-gradient(130deg, #4b0082, #8a2be2);
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: white;
      text-align: center;
      padding-top: 50px;
    }

    .box {
      width: 420px;
      margin: auto;
      padding: 30px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0px 0px 18px rgba(0,0,0,0.3);
      animation: aparecer 0.9s ease;
    }

    h2 {
      margin-bottom: 15px;
    }

    button {
      background: #ffcc00;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      transition: 0.25s;
      margin-top: 15px;
    }

    button:hover {
      background: #ffe066;
      transform: scale(1.07);
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>🪄 Magia da Palavra Secreta</h2>
    <p>Para entrar no castelo, você deve descobrir a palavra correta.</p>
    <button onclick="abrirCastelo()">Tentar Palavra</button>
  </div>

  <script src="./script.js"></script>

</body>
</html>
