<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Adivinhe o Número - WHILE</title>

  <style>
    body {
      background: linear-gradient(#4e54c8);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
      padding-top: 60px;
      display: flex;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 15px;
      width: 350px;
      margin: auto;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      animation: fadeIn 1s ease;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 26px;
      font-weight: 600;
    }

    button {
      background: #ffcc00;
      color: #333;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #ffdb4d;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Jogo de Adivinhação</h2>
    <p>Aperte o botão para começar a jogar.</p>
    <button onclick="iniciarJogo()">Iniciar Jogo</button>
  </div>

  <script src="./script.js"></script>

</body>
</html>
